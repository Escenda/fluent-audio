[project]
name = "fluent-audio-contracts"
version = "0.1.0"
description = "Generated protobuf contracts for fluent-audio"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "protobuf>=6.33.5,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fluent_audio_contracts"]
