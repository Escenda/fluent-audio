nodes:
  - id: silence_source
    path: python
    args: ../nodes/audio_device/raw_pcm_source/main.py --dora --input ../tests/fixtures/cpal/silence_48k_stereo_250ms.s16le --sample-rate-hz 48000 --channels 2 --sample-format s16le --channel-layout interleaved --chunk-frames 480 --source-id cpal_sink_smoke --stream-id audio/cpal_sink/smoke --start-seq 0 --start-sample-index 0 --start-capture-time-ns 0
    outputs:
      - audio

  - id: cpal_sink
    build: ../scripts/dora_cargo_build.sh ../nodes/audio_device/cpal_sink/Cargo.toml
    path: ../nodes/audio_device/cpal_sink/target/debug/cpal_sink
    args: --device-id alsa:hw:CARD=APE,DEV=0 --sample-rate-hz 48000 --channels 2 --sample-format s16le --channel-layout interleaved --buffer-size-frames 480 --queue-capacity-chunks 64 --startup-buffer-chunks 4 --source-id cpal_sink_smoke --stream-id audio/cpal_sink/smoke --completion-timeout-ms 5000
    inputs:
      audio:
        source: silence_source/audio
        queue_size: 64
        queue_policy: backpressure
