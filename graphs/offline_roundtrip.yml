      - audio

  - id: raw_pcm_sink
    path: python
    args: ../nodes/audio_device/raw_pcm_sink/main.py --dora --output ../artifacts/offline/output.s16le --sample-rate-hz 16000 --channels 1 --sample-format s16le --channel-layout interleaved --source-id offline_file --stream-id audio/offline/mono16k --overwrite
    inputs:
      audio:
        source: raw_pcm_source/audio
        queue_size: 8
