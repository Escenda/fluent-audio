[package]
name = "fluent-audio-cpal-capture"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "cpal_capture"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
cpal = "0.18.1"
dora-node-api = "0.5.0"
eyre = "0.6"
fluent-audio-io-boundary = { path = "../../shared/rust_audio_boundary" }
thiserror = "2.0"
