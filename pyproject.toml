[project]
name = "fluent-audio"
version = "0.1.0"
description = "Standalone audio runtime for voice-agent and robotics integration"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
vad = [
    "numpy",
    "onnxruntime",
]
dora = [
    "dora-rs>=0.5.0",
    "pyarrow>=16.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fluent_audio"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
